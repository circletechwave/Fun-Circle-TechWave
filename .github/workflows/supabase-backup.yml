name: Supabase Database Backup

on:
  push:
    branches:
      - feature/supabase-backup
  schedule:
    # 毎週日曜日 00:00 UTC (日本時間 09:00) に定期実行
    - cron: '0 0 * * 0'
  workflow_dispatch: # GitHubのUIから手動でバックアップを実行可能にする

jobs:
  backup:
    name: Database Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          # PostgreSQL公式のAPTリポジトリを追加（apt-key非推奨対応）
          sudo mkdir -p /etc/apt/keyrings
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list

          # パッケージリストを更新してPostgreSQL 17クライアントをインストール
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          # インストール確認とバージョン表示
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Run pg_dump (Full Backup)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Error: SUPABASE_DB_URL is not set."
            exit 1
          fi

          # バックアップファイル名に実行時の日付を付与
          BACKUP_DATE=$(date +'%Y-%m-%d_%H-%M-%S')
          FILENAME="supabase_full_backup_${BACKUP_DATE}.sql"

          echo "Starting full database backup..."
          echo "Backup includes: schemas (public, auth, storage), roles, and privileges"

          # 完全バックアップ: すべてのスキーマ、ロール、権限を含む
          # --clean: 復元時に既存オブジェクトを削除
          # --if-exists: DROP文にIF EXISTSを追加
          # --create: データベース作成文を含める
          # すべてのスキーマを明示的に指定（public, auth, storage, extensions等）
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --clean \
            --if-exists \
            --create \
            --format=plain \
            --encoding=UTF8 \
            --schema=public \
            --schema=auth \
            --schema=storage \
            --schema=extensions \
            --schema=graphql_public \
            > "$FILENAME"

          echo "✅ Full database backup created: $FILENAME"
          ls -lh "$FILENAME"

          # ファイル名を環境変数経由で次のステップに渡す
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          # 30日間（約1ヶ月）保存し、期限が切れたら自動削除する
          retention-days: 30
